<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel de Administración - META</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%231A56DB%22/><path d=%22M28 52 L42 66 L72 34%22 fill=%22none%22 stroke=%22white%22 stroke-width=%2210%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: var(--md-surface-1); }
    .admin-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    .admin-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .admin-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--md-on-surface);
      margin: 0;
    }
    .admin-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
    }
    .admin-item {
      background: var(--md-surface);
      border-radius: var(--shape-sm);
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--elev-1);
    }
    .admin-item-info { flex: 1; }
    .admin-item-name {
      font-weight: 600;
      font-size: 1rem;
      color: var(--md-on-surface);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .admin-item-meta {
      font-size: 0.85rem;
      color: var(--md-on-surface-var);
    }
    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: var(--shape-xs);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge.aplicador { background: var(--md-primary-container); color: var(--md-primary); }
    .badge.veedor    { background: var(--md-secondary-container); color: var(--md-secondary); }
    
    .btn-delete {
      background: var(--md-error-container);
      color: var(--md-error);
      border: none;
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-delete:hover {
      background: var(--md-error);
      color: #fff;
      transform: scale(1.05);
    }
    .btn-delete:active { transform: scale(0.95); }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--md-outline);
      background: var(--md-surface);
      border-radius: var(--shape-sm);
      border: 1px dashed var(--md-outline-variant);
    }
    .filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .filter-chip {
      background: var(--md-surface);
      border: 1px solid var(--md-outline-variant);
      color: var(--md-on-surface-var);
      border-radius: var(--shape-full);
      padding: 6px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .filter-chip.active {
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      border-color: transparent;
    }
  </style>
</head>
<body>

<div class="admin-container">
  <div class="admin-header">
    <h1 class="admin-title">Panel de Control</h1>
    <button class="btn btn-filled" id="btn-export-excel" onclick="Admin.exportExcel()" style="width:auto; height:44px; padding: 0 20px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Exportar a Excel
    </button>
  </div>

  <div class="stats-grid" style="margin-bottom: 24px;">
    <div class="stat-card">
      <div class="stat-num" id="stat-total">—</div>
      <div class="stat-label">Total</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-aplicadores" style="color:var(--md-primary)">—</div>
      <div class="stat-label">Aplicadores</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-veedores" style="color:var(--md-secondary)">—</div>
      <div class="stat-label">Veedores</div>
    </div>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
    <h2 style="font-size:1.1rem; font-weight:600; margin: 0; color:var(--md-on-surface);">Registros del día</h2>
  </div>

  <div class="filter-row">
    <button class="filter-chip active" id="filter-all" onclick="Admin.setFilter('all')">Todos</button>
    <button class="filter-chip" id="filter-aplicador" onclick="Admin.setFilter('aplicador')">Aplicadores</button>
    <button class="filter-chip" id="filter-veedor" onclick="Admin.setFilter('veedor')">Veedores</button>
  </div>

  <div class="admin-list" id="admin-list">
    <div class="empty-state">Cargando registros...</div>
  </div>
</div>

<!-- Scripts -->
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script src="admin.js"></script>

</body>
</html>
